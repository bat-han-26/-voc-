name: Qoo10 리뷰 크롤링

on:
  workflow_dispatch:
    inputs:
      search:
        description: "검색 키워드 (예: colorgram ティント)"
        required: false
        default: "colorgram ティント"
      products:
        description: "상품 gd_no 목록 (쉼표 구분, 예: 1057459512,1135003693)"
        required: false
        default: ""
      translate:
        description: "일→한 번역 여부 (GEMINI_API_KEY 필요)"
        type: boolean
        default: true
      search_pages:
        description: "검색 페이지 수"
        required: false
        default: "3"
      commit_result:
        description: "결과 CSV를 레포에 커밋"
        type: boolean
        default: true

jobs:
  crawl:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 레포 체크아웃
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install requests beautifulsoup4

      - name: 크롤링 실행
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          ARGS="--out data/review_result.csv"

          # 검색 키워드
          if [ -n "${{ github.event.inputs.search }}" ]; then
            ARGS="$ARGS --search '${{ github.event.inputs.search }}'"
            ARGS="$ARGS --search-pages ${{ github.event.inputs.search_pages }}"
          fi

          # 상품 gd_no 목록
          if [ -n "${{ github.event.inputs.products }}" ]; then
            IFS=',' read -ra PRODS <<< "${{ github.event.inputs.products }}"
            for p in "${PRODS[@]}"; do
              ARGS="$ARGS --product $(echo $p | xargs)"
            done
          fi

          # 번역
          if [ "${{ github.event.inputs.translate }}" = "true" ] && [ -n "$GEMINI_API_KEY" ]; then
            ARGS="$ARGS --translate"
          fi

          echo "실행 명령: python scripts/qoo10_crawler_standalone.py $ARGS"
          eval python scripts/qoo10_crawler_standalone.py $ARGS

      - name: 수집 결과 확인
        run: |
          if [ -f data/review_result.csv ]; then
            echo "=== 수집 완료 ==="
            wc -l data/review_result.csv
            head -3 data/review_result.csv
          else
            echo "CSV 파일이 생성되지 않았습니다." && exit 1
          fi

      - name: CSV 아티팩트 업로드
        uses: actions/upload-artifact@v4
        with:
          name: review_result_${{ github.run_number }}
          path: data/review_result.csv
          retention-days: 30

      - name: 결과 CSV 커밋
        if: ${{ github.event.inputs.commit_result == 'true' }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/review_result.csv
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            ROWS=$(wc -l < data/review_result.csv)
            git commit -m "chore: Qoo10 리뷰 수집 결과 업데이트 (${ROWS}행) [run #${{ github.run_number }}]"
            git push
          fi
